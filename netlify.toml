[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy /api/* to Render backend
[[redirects]]
  from   = "/api/*"
  to     = "https://ai-pr-reviewer-api.onrender.com/api/:splat"
  status = 200
  force  = true
  headers = {X-From = "Netlify"}

# SPA routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
