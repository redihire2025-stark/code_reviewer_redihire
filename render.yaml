# render.yaml — Render Blueprint (must be at repo ROOT)
#
# 100% FREE STACK — no credit card needed anywhere:
#   Neon (neon.tech)   → free PostgreSQL
#   Render free tier   → web service
#   Netlify free tier  → frontend dashboard
#   Groq free tier     → AI code reviews
#
# HOW TO DEPLOY:
#   1. Create free Neon DB at https://neon.tech
#      → Dashboard → Connection Details → select "Prisma"
#      → copy DATABASE_URL (pooled) and DIRECT_URL (direct)
#   2. Connect this repo in Render as a Blueprint (leave root dir blank)
#   3. After first deploy, add these env vars in Render dashboard:
#        DATABASE_URL       → Neon pooled connection string
#        DIRECT_URL         → Neon direct connection string
#        GITHUB_APP_ID      → from github.com/settings/apps
#        GITHUB_PRIVATE_KEY → single-line PEM (newlines as \n)
#        GITHUB_WEBHOOK_SECRET → run: openssl rand -hex 32
#        GROQ_API_KEY       → from console.groq.com
#        FRONTEND_URL       → your Netlify URL (after frontend deploy)

services:
  - type: web
    name: ai-pr-reviewer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: deepseek-r1-distill-llama-70b
      - key: FRONTEND_URL
        sync: false
