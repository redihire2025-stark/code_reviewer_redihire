# render.yaml — Render Blueprint (repo ROOT)
# 100% FREE: Neon DB + Render web service + Netlify frontend + Groq AI
#
# After Blueprint deploys, go to the service Environment tab and add:
#   DATABASE_URL       → postgresql://neondb_owner:npg_WPpaK3Uirx7D@ep-long-star-ap2rcddq-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
#   DIRECT_URL         → postgresql://neondb_owner:npg_WPpaK3Uirx7D@ep-long-star-ap2rcddq.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
#   GITHUB_APP_ID      → from github.com/settings/apps
#   GITHUB_PRIVATE_KEY → single-line PEM (newlines replaced with \n)
#   GITHUB_WEBHOOK_SECRET → run: openssl rand -hex 32
#   GROQ_API_KEY       → from console.groq.com
#   FRONTEND_URL       → your Netlify URL after frontend deploy

services:
  - type: web
    name: ai-pr-reviewer-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: deepseek-r1-distill-llama-70b
      - key: FRONTEND_URL
        sync: false
